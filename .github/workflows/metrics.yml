name: Cyberpunk Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate neon isometric metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg

          # sections to render
          base: "header, activity, community, repositories, metadata"
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # neon cyberpunk palette painted over the default dark template
          extras_css: |
            :root {
              --color-canvas-default: #050208 !important;
              --color-canvas-subtle: #0d0221 !important;
              --color-border-default: #ff2ec4 !important;
              --color-fg-default: #c9d1e9 !important;
              --color-accent-fg: #00fff2 !important;
            }
            body { background-color: #050208 !important; }
            h2.field, .field .title { color: #00fff2 !important; }
            a { color: #ff2ec4 !important; }
