name: Cyberpunk Contribution Snake

on:
  schedule:
    # regenerate every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate neon snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # neon cyberpunk palette: deep-space purple -> violet -> magenta -> cyan
          outputs: |
            dist/github-snake-neon.svg?color_snake=#00fff2&color_dots=#0d0221,#3c096c,#7b2ff7,#ff2ec4,#00fff2
            dist/github-snake-neon.gif?color_snake=#00fff2&color_dots=#0d0221,#3c096c,#7b2ff7,#ff2ec4,#00fff2&color_background=#050208

      - name: Push generated files to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
